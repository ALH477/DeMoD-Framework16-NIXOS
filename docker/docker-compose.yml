version: '3.8'
services:
  dcf-test:
    image: ubuntu:22.04
    volumes:
      - ../DeMoD-Communication-Framework:/dcf
    environment:
      - SBCL_HOME=/usr/lib/sbcl
    command: >
      bash -c "
        apt-get update &&
        apt-get install -y sbcl libserialport-dev libsocketcan-dev libsctp-dev libncurses-dev libuuid-dev &&
        curl -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp &&
        sbcl --load /tmp/quicklisp.lisp --eval '(quicklisp-quickstart:install)' --quit &&
        sbcl --load /dcf/lisp/src/d-lisp.lisp --eval '(d-lisp:main \"quick-start-client\" \"/dcf/lisp/config.json\")'
      "
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/ttyACM1:/dev/ttyACM1
    network_mode: host
    privileged: true
